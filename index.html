<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clay'sCars.com - Madison, IN</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { background: #0074D9; color: white; padding: 1rem; text-align: center; }
    .container { padding: 2rem; max-width: 900px; margin: auto; }
    .search-box { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    label { font-weight: bold; }
    select, button { padding: 0.5rem; font-size: 1rem; }
    button { background: #0074D9; color: white; border: none; cursor: pointer; }
    button:hover { background: #005fa3; }
    .car-result { background: white; padding: 1rem; margin-bottom: 1rem; border-left: 4px solid #0074D9; display: flex; align-items: center; gap: 1rem; }
    .car-result img { width: 100px; height: auto; border: 1px solid #ccc; }
    .car-details h3 { margin: 0 0 0.5rem 0; font-size: 1.2rem; }
    .car-details a { text-decoration: none; color: #0074D9; }
    .car-details a:hover { text-decoration: underline; }
    .grid .car-result { display: inline-block; width: 45%; vertical-align: top; }
  </style>
</head>
<body>
  <header>
    <h1>Clay'sCars.com</h1>
    <p>All Cars in Madison, Indiana</p>
  </header>
  <div class="container">
    <div class="search-box">
      <label for="make">Make:</label>
      <select id="make"></select>
      <label for="model">Model:</label>
      <select id="model"></select>
      <label for="year">Year:</label>
      <select id="year"></select>
      <label for="sort">Sort:</label>
      <select id="sort">
        <option value="">Default</option>
        <option value="priceAsc">Price: Low → High</option>
        <option value="priceDesc">Price: High → Low</option>
        <option value="yearDesc">Newest</option>
        <option value="yearAsc">Oldest</option>
      </select>
      <button onclick="searchCars()">Search</button>
      <button onclick="resetFilters()">Clear</button>
      <button onclick="toggleView()">Toggle View</button>
    </div>
    <div id="results"></div>
  </div>

  <script>
    let carInventory = [];
    let lastFilteredCars = [];
    let isGridView = false;

    fetch("cars.json")
      .then(res => res.json())
      .then(data => {
        carInventory = data;
        populateDropdowns(carInventory);
        loadFilters();
        searchCars();
      });

    function populateDropdowns(data) {
      const makeSelect = document.getElementById("make");
      const modelSelect = document.getElementById("model");
      const yearSelect = document.getElementById("year");

      const makes = [...new Set(data.map(car => car.make))];
      makeSelect.innerHTML = '<option value="">All Makes</option>' + makes.map(make => `<option value="\${make}">\${make}</option>`).join("");

      makeSelect.onchange = () => {
        const selectedMake = makeSelect.value;
        const filteredModels = data.filter(car => car.make === selectedMake || !selectedMake);
        const models = [...new Set(filteredModels.map(car => car.model))];
        modelSelect.innerHTML = '<option value="">All Models</option>' + models.map(model => `<option value="\${model}">\${model}</option>`).join("");
        modelSelect.dispatchEvent(new Event('change'));
      };

      modelSelect.onchange = () => {
        const selectedMake = makeSelect.value;
        const selectedModel = modelSelect.value;
        const filteredYears = data.filter(car =>
          (!selectedMake || car.make === selectedMake) &&
          (!selectedModel || car.model === selectedModel)
        );
        const years = [...new Set(filteredYears.map(car => car.year))].sort((a, b) => b - a);
        yearSelect.innerHTML = '<option value="">All Years</option>' + years.map(year => `<option value="\${year}">\${year}</option>`).join("");
      };

      makeSelect.dispatchEvent(new Event('change'));
    }

    function searchCars() {
      const make = document.getElementById("make").value.toLowerCase();
      const model = document.getElementById("model").value.toLowerCase();
      const year = document.getElementById("year").value;
      const sort = document.getElementById("sort").value;

      saveFilters();

      let filtered = carInventory.filter(car =>
        (make === "" || car.make.toLowerCase() === make) &&
        (model === "" || car.model.toLowerCase() === model) &&
        (year === "" || car.year === year)
      );

      filtered = sortCars(filtered, sort);
      displayCars(filtered);
    }

    function sortCars(cars, criteria) {
      switch (criteria) {
        case "priceAsc":
          return cars.sort((a, b) => parseInt(a.price.replace(/[^0-9]/g, '')) - parseInt(b.price.replace(/[^0-9]/g, '')));
        case "priceDesc":
          return cars.sort((a, b) => parseInt(b.price.replace(/[^0-9]/g, '')) - parseInt(a.price.replace(/[^0-9]/g, '')));
        case "yearAsc":
          return cars.sort((a, b) => a.year - b.year);
        case "yearDesc":
          return cars.sort((a, b) => b.year - a.year);
        default:
          return cars;
      }
    }

    function resetFilters() {
      document.getElementById("make").value = "";
      document.getElementById("model").value = "";
      document.getElementById("year").value = "";
      document.getElementById("sort").value = "";
      searchCars();
    }

    function toggleView() {
      isGridView = !isGridView;
      displayCars(lastFilteredCars);
    }

    function displayCars(cars) {
      lastFilteredCars = cars;
      const resultsDiv = document.getElementById("results");
      resultsDiv.className = isGridView ? "grid" : "list";
      resultsDiv.innerHTML = "";

      if (cars.length === 0) {
        resultsDiv.innerHTML = "<p>No cars found matching your criteria in Madison, IN.</p>";
        return;
      }

      cars.forEach(car => {
        const div = document.createElement("div");
        div.className = "car-result";
        div.innerHTML = \`
          <img src="\${car.image}" alt="\${car.make} \${car.model}" />
          <div class="car-details">
            <h3><a href="\${car.link}" target="_blank">\${car.year} \${car.make} \${car.model}</a></h3>
            <p>\${car.price} — \${car.dealer}</p>
          </div>
        \`;
        resultsDiv.appendChild(div);
      });
    }

    function saveFilters() {
      localStorage.setItem("filters", JSON.stringify({
        make: document.getElementById("make").value,
        model: document.getElementById("model").value,
        year: document.getElementById("year").value,
        sort: document.getElementById("sort").value
      }));
    }

    function loadFilters() {
      const filters = JSON.parse(localStorage.getItem("filters"));
      if (filters) {
        document.getElementById("make").value = filters.make;
        document.getElementById("model").value = filters.model;
        document.getElementById("year").value = filters.year;
        document.getElementById("sort").value = filters.sort;
      }
    }
  </script>
</body>
</html>
